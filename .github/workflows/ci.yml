name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 纯函数测试,不产生 API 调用,可以进 CI。
      # smoke 与 e2e 会真调 API,留给本地手动跑。
      - name: Unit tests
        run: npm run unit

      - name: Build
        run: npm run build
